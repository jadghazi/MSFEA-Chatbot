[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msfea-bot"
version = "0.1.0"
description = "RAG chatbot for the AUB MSFEA internship course"
requires-python = ">=3.11"

# Runtime dependencies. We add only what the CURRENT phase needs, with a reason,
# per CLAUDE.md §6. Heavier, choice-dependent libraries (the embedding model, the
# pgvector driver, the LLM SDK) are added in the phase that introduces them, so
# each choice can be made on the record with trade-offs (§4/§5) instead of guessed
# now.
dependencies = [
    "fastapi>=0.115",          # API layer the widget calls
    "uvicorn[standard]>=0.30", # ASGI server to run FastAPI
    "pydantic-settings>=2.4",  # load + validate all env vars in one place (§6)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",   # tests for retrieval/ingestion logic (§6)
    "httpx>=0.27", # required by FastAPI's TestClient
    "ruff>=0.6",   # linter/formatter
    "mypy>=1.11",  # static type checking (type hints are required, §6)
]

[tool.hatch.build.targets.wheel]
packages = ["src/msfea_bot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
