[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msfea-bot"
version = "0.1.0"
description = "RAG chatbot for the AUB MSFEA internship course"
requires-python = ">=3.11"

# Runtime dependencies. We add only what the CURRENT phase needs, with a reason,
# per CLAUDE.md §6. Heavier, choice-dependent libraries (the embedding model, the
# pgvector driver, the LLM SDK) are added in the phase that introduces them, so
# each choice can be made on the record with trade-offs (§4/§5) instead of guessed
# now.
dependencies = [
    "fastapi>=0.115",              # API layer the widget calls
    "uvicorn[standard]>=0.30",     # ASGI server to run FastAPI
    "pydantic-settings>=2.4",      # load + validate all env vars in one place (§6)
    "python-docx>=1.1",            # parse .docx sources (paragraphs + tables) for ingestion
    "python-pptx>=1.0",            # parse .pptx sources (slide text) for ingestion
    "pypdf>=4.0",                  # extract text from .pdf sources (e.g. CO-OP handbook) for normalization
    "sentence-transformers>=3.0",  # local embedding model (ADR-0004), free/offline
    "psycopg[binary]>=3.2",        # PostgreSQL driver for the pgvector store (§3)
    "pgvector>=0.3",               # pgvector helpers for psycopg
    "spacy>=3.7",                  # local NER for name redaction (ADR-0009), free/offline
]
# NOTE: the spaCy model must also be installed once (not on PyPI as a normal dep):
#   python -m spacy download en_core_web_sm
# This is baked into the Docker image in Phase 10.

[project.optional-dependencies]
dev = [
    "pytest>=8",   # tests for retrieval/ingestion logic (§6)
    "httpx>=0.27", # required by FastAPI's TestClient
    "ruff>=0.6",   # linter/formatter
    "mypy>=1.11",  # static type checking (type hints are required, §6)
]
# Per-provider LLM SDKs are optional extras so the core stays vendor-neutral
# (§3). The provider is selected at runtime behind msfea_bot.llm.
gemini = [
    "google-genai>=1.0", # Gemini SDK (ADR-0005, provisional provider)
]

[tool.hatch.build.targets.wheel]
packages = ["src/msfea_bot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# Third-party libraries without type stubs — don't fail on missing imports.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "google.*", "spacy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." so the top-level eval/ harness is importable
testpaths = ["tests"]
