# nginx reverse-proxy template — for an IT-managed nginx that terminates TLS.
# (If you don't already run nginx, prefer the Caddy option in docker-compose.prod.yml,
# which handles HTTPS automatically.)
#
# Replace the server_name and the TLS cert paths with the real values from IT.
# This assumes the app publishes port 8000 on the host (the default compose setup).
# nginx forwards the real client IP; the app must run with TRUST_PROXY_HEADERS=true
# so the rate limiter sees that IP instead of nginx's.

server {
    listen 80;
    server_name chatbot.aub.edu.lb;
    return 301 https://$host$request_uri;   # force HTTPS
}

server {
    listen 443 ssl;
    server_name chatbot.aub.edu.lb;

    ssl_certificate     /etc/ssl/certs/chatbot.crt;      # <- from IT
    ssl_certificate_key /etc/ssl/private/chatbot.key;    # <- from IT

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
