name: CI

# Lint + type-check + tests + a gated retrieval eval on every push/PR (§5.10, §4).
# The answer eval is intentionally NOT here: it calls the live LLM (needs an API
# key + burns free-tier quota), so it stays a manual/local check.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: msfea
          POSTGRES_PASSWORD: msfea
          POSTGRES_DB: msfea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msfea -d msfea"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://msfea:msfea@localhost:5432/msfea

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          # The gemini extra is installed so the provider-wiring test actually runs
          # here (it guards ADR-0012's sampling params). It stays an optional extra
          # in pyproject — the core package remains vendor-neutral (§3). No API key
          # is needed: that test fakes the SDK client.
          pip install -e ".[dev,gemini]"
          python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        run: ruff check src tests eval

      - name: Type-check (mypy --strict)
        run: mypy --strict src

      - name: Tests (pytest — includes DB-backed tests via the Postgres service)
        run: pytest -q

      - name: Retrieval eval (gates on context-recall floor)
        env:
          EVAL_MIN_CONTEXT_RECALL: "0.90"
        run: |
          python -m msfea_bot.skeleton ingest
          python -m eval.retrieval_eval
